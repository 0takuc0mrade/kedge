[package]
name = "kedge-agent"
version = "0.1.0"
edition = "2021"
description = "Kedge — Autonomous Claim Adjuster for parametric shipping insurance on Mantle Network"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
alloy = { version = "2.0", features = ["full"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
eyre = "0.6"
kedge-core = { path = "../core" }
kedge-methods = { path = "../methods" }
risc0-zkvm = "3.0"
risc0-ethereum-contracts = "3.0.1"
url = "2.5.8"

[dev-dependencies]
ed25519-dalek = "2.2"
